<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthlings' Roll Call</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #020617; color: #f8fafc; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-earth { background: linear-gradient(90deg, #38bdf8, #818cf8); }
        .hidden { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="app" class="glass max-w-lg w-full rounded-3xl p-8 shadow-2xl">
        <div id="s1">
            <h1 class="text-3xl font-bold text-sky-400 text-center mb-6">Earthlings' Roll Call</h1>
            <input type="text" id="userName" class="w-full bg-slate-800 rounded-xl p-4 mb-4 text-white outline-none" placeholder="Ваше имя">
            <button onclick="startTest()" class="btn-earth w-full py-4 rounded-xl font-bold uppercase">Начать</button>
        </div>
        <div id="s2" class="hidden">
            <div id="questions" class="space-y-3 mb-6 text-sm"></div>
            <button onclick="calc()" class="btn-earth w-full py-4 rounded-xl font-bold uppercase text-xs">РЕЗУЛЬТАТ</button>
        </div>
        <div id="s3" class="hidden text-center">
            <h2 id="status" class="text-4xl font-bold mb-4 text-sky-400"></h2>
            <div id="participation-form" class="space-y-4 text-left">
                <input type="text" id="contact" class="w-full bg-slate-800 rounded-xl p-3 text-white outline-none" placeholder="TG для связи">
                <button onclick="save()" id="final-btn" class="bg-emerald-600 w-full py-4 rounded-xl font-bold uppercase">ОТПРАВИТЬ</button>
            </div>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://hgewwcxlhtuhzvkblpvi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnZXd3Y3hsaHR1aHp2a2JscHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTI2NTksImV4cCI6MjA5MTc2ODY1OX0.m8Q48c6XQj5JaZ-H1ECvFBGHzNomlkpdRtpa42ijyGo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const qs = ["Жизнь важна?","Ресурсы общие?","Границы — преграда?","Труд во благо?","Мир без войн?","Делиться опытом?","Ответственность?","Без дефицита?","Доверие?","Начать с себя?"];
        function startTest(){
            document.getElementById('s1').classList.add('hidden');
            document.getElementById('s2').classList.remove('hidden');
            const cont = document.getElementById('questions');
            cont.innerHTML = '';
            qs.forEach(q => cont.innerHTML += `<label class="flex items-center bg-slate-800 p-3 rounded-xl mb-2 cursor-pointer"><input type="checkbox" class="q-check mr-3 w-4 h-4 accent-sky-500"><span>${q}</span></label>`);
        }
        function calc(){
            document.getElementById('s2').classList.add('hidden');
            document.getElementById('s3').classList.remove('hidden');
            document.getElementById('status').innerText = "Землянин";
        }
        async function save(){
            const btn = document.getElementById('final-btn');
            btn.disabled = true; btn.innerText = "СВЯЗЬ...";
            let region = "Kyiv, Ukraine"; 
            try {
                const res = await fetch('https://ipapi.co/json/');
                const geo = await res.json();
                region = `${geo.city}, ${geo.country_name}`;
            } catch(e){}
            const { error } = await _supabase.from('users').insert([{
                name: document.getElementById('userName').value,
                status: document.getElementById('status').innerText,
                region: region,
                participation: { contact: document.getElementById('contact').value }
            }]);
            if(error) { alert("Ошибка: " + error.message); btn.disabled = false; }
            else { window.location.href = 'map.html'; }
        }
    </script>
</body>
</html>
