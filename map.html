<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><title>Earthlings Map</title>
    <script src="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.x/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #020617; font-family: sans-serif; color: white; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .ui { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(15,23,42,0.95); padding: 20px; border-radius: 20px; border: 1px solid #38bdf8; width: 260px; backdrop-filter: blur(10px); }
        .district-card { background: rgba(30,41,59,0.5); padding: 12px; border-radius: 12px; margin-top: 10px; border-left: 4px solid #38bdf8; }
        .progress-bar { height: 6px; background: #1e293b; border-radius: 3px; margin-top: 8px; overflow: hidden; }
        .progress-fill { height: 100%; background: #38bdf8; transition: width 1.5s; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="ui">
        <div style="font-size: 10px; color: #38bdf8;">ГЛОБАЛЬНАЯ ПЕРЕКЛИЧКА</div>
        <div style="font-size: 38px; font-weight: bold;" id="total">0</div>
        <div id="districts-list"></div>
        <a href="index.html" style="display:block; margin-top:20px; color:#38bdf8; text-decoration:none; font-size:11px;">← К ТЕСТУ</a>
    </div>
    <script>
        const SUPABASE_URL = 'https://hgewwcxlhtuhzvkblpvi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhnZXd3Y3hsaHR1aHp2a2JscHZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTI2NTksImV4cCI6MjA5MTc2ODY1OX0.m8Q48c6XQj5JaZ-H1ECvFBGHzNomlkpdRtpa42ijyGo';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const map = new maplibregl.Map({ container: 'map', style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json', center: [30.52, 50.45], zoom: 10 });

        async function loadData() {
            const { count } = await _supabase.from('users').select('*', { count: 'exact', head: true });
            document.getElementById('total').innerText = count || 0;
            const { data } = await _supabase.from('district_stats').select('*');
            if(data) {
                const list = document.getElementById('districts-list');
                list.innerHTML = '';
                data.forEach(d => {
                    list.innerHTML += `<div class="district-card">
                        <div style="display:flex; justify-content:space-between;"><b>${d.region.split(',')[0]}</b> <span>${d.percent_ready}%</span></div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(d.percent_ready*10, 100)}%"></div></div>
                    </div>`;
                });
            }
        }
        map.on('load', loadData);
    </script>
</body>
</html>
